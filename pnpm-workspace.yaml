packages:
  - "packages/*"
  - "apps/*"

# Dependencias con script de instalación, aprobadas explícitamente (pnpm 11 las
# bloquea por defecto: es una frontera de seguridad, no un detalle).
allowBuilds:
  # Empaquetador de Vite; sólo lo usa el playground (dev, no se publica).
  esbuild: true
  # Runtime ONNX: baja su binario nativo en el postinstall. Sin esto el gate de
  # verificación visual no puede ejecutar inferencia.
  onnxruntime-node: true
  # Códec que usa el runtime ONNX para cargar los modelos.
  protobufjs: true
